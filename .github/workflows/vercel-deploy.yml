name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - develop

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: write

jobs:
  deploy-production:
    name: Deploy to Vercel (Production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-increment version and commit
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          VERSION="v1.0.${{ github.run_number }}"
          echo "Updating version to $VERSION ($BUILD_DATE)"
          sed -i "s/export const APP_VERSION = .*/export const APP_VERSION = '$VERSION';/" js/core/version.js
          sed -i "s/export const APP_BUILD_DATE = .*/export const APP_BUILD_DATE = '$BUILD_DATE';/" js/core/version.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/core/version.js
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to $VERSION ($BUILD_DATE) [skip ci]"
            git push origin main
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production

      - name: Build Project Artifacts
        run: vercel build --prod

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod

  deploy-preview:
    name: Deploy to Vercel (Preview - develop)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts
        run: vercel build

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt
