<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaflight Manager (Auto-Port & Dropdown)</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333333;
      --primary: #ffaa00;
      --primary-hover: #e09600;
      --secondary: #00aaee;
      --secondary-hover: #0088cc;
      --text: #e0e0e0;
      --terminal: #00ff66;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      max-width: 740px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 11px;
      background: #333;
      padding: 3px 8px;
      border-radius: 4px;
      color: #aaa;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #bbb;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: #181818;
      color: #eee;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      resize: vertical;
    }

    .port-selector-bar {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #252525;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .port-selector-bar label {
      margin: 0;
      white-space: nowrap;
      font-weight: 600;
      color: #fff;
    }

    select {
      background: #181818;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      flex-grow: 1;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      border: none;
      transition: background 0.15s ease;
    }

    .btn-flash {
      background: var(--primary);
      color: #000;
    }
    .btn-flash:hover { background: var(--primary-hover); }

    .btn-backup {
      background: var(--secondary);
      color: #000;
    }
    .btn-backup:hover { background: var(--secondary-hover); }

    button:disabled {
      background: #444 !important;
      cursor: not-allowed !important;
      color: #777 !important;
    }

    #log {
      margin-top: 15px;
      background: #080808;
      color: var(--terminal);
      font-family: Consolas, Monaco, "Courier New", monospace;
      padding: 12px;
      border-radius: 6px;
      height: 180px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      border: 1px solid #222;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #202020;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-box.success { border-left: 8px solid #00ff66; }
    .modal-box.error { border-left: 8px solid #ff3333; }
    .modal-box h3 { margin-top: 0; font-size: 18px; }
    .modal-box p { font-size: 14px; line-height: 1.4; color: #ccc; }

    .btn-close {
      margin-top: 15px;
      background: #333;
      color: #fff;
    }
    /* Modal Backdrop & Positioning */
    .modal {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #202020;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transform: translateY(10px);
      transition: transform 0.3s ease;
    }

    .modal.active .modal-box {
      transform: translateY(0);
    }

    .modal-box.success {
      border-left: 8px solid #00ff66;
    }

    .modal-box.error {
      border-left: 8px solid #ff3333;
    }

    .modal-box h3 {
      margin-top: 0;
      font-size: 18px;
    }

    .modal-box p {
      font-size: 14px;
      line-height: 1.4;
      color: #ccc;
    }

    .btn-close {
      margin-top: 15px;
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-close:hover {
      background: #444;
    }
  </style>
</head>
<body>

  <!-- Блок вибору порту у стилі Betaflight -->
  <div class="port-selector-bar">
    <label for="portSelect">Порт:</label>
    <select id="portSelect">
      <option value="new">+ Обрати / Додати новий порт...</option>
    </select>
  </div>

  <div class="controls">
    <button id="btnFlash" class="btn-flash">Підключити та прошити</button>
    <select id="backupType">
      <option value="diff all">diff all (лише зміни)</option>
      <option value="dump all">dump all (повний бекап)</option>
    </select>
    <button id="btnBackup" class="btn-backup">Зберегти бекап у файл</button>
  </div>

  <div id="log">Очікування дій...</div>
</div>

<div id="statusModal" class="modal">
  <div id="modalBox" class="modal-box">
    <h3 id="modalTitle">Статус</h3>
    <p id="modalMsg"></p>
    <button id="modalCloseBtn" class="btn-close" onclick="closeModal()">Закрити</button>
  </div>
</div>

<script>
  let port = null;
  let availablePorts = []; // Масив збережених портів
  const logDiv = document.getElementById('log');
  const btnFlash = document.getElementById('btnFlash');
  const btnBackup = document.getElementById('btnBackup');
  const portSelect = document.getElementById('portSelect');
  const backupTypeSelect = document.getElementById('backupType');

  function log(msg) {
    logDiv.textContent += msg + '\n';
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  let popupTimer = null;

  function showPopup(type, title, message, nextStepCallback = null) {
    const modal = document.getElementById('statusModal');
    const box = document.getElementById('modalBox');
    const closeBtn = document.getElementById('modalCloseBtn');

    // Clear any existing timer if a new popup is called rapidly
    if (popupTimer) {
      clearTimeout(popupTimer);
      popupTimer = null;
    }

    box.className = 'modal-box ' + type;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = message;

    if (type === 'success') {
      // 1. Hide the close button for success state
      closeBtn.style.display = 'none';

      // 2. Make visible with fade-in transition
      modal.classList.add('active');

      // 3. Automatically fade out after 2000ms (2 seconds)
      popupTimer = setTimeout(() => {
        closeModal();

        // Hook for your upcoming next step
        if (typeof nextStepCallback === 'function') {
          nextStepCallback();
        }
      }, 2000);

    } else {
      // For error/crash: keep persistent and show manual close button
      closeBtn.style.display = 'inline-block';
      modal.classList.add('active');
    }
  }

  function closeModal() {
    const modal = document.getElementById('statusModal');
    modal.classList.remove('active');
    if (popupTimer) {
      clearTimeout(popupTimer);
      popupTimer = null;
    }
  }

  const delay = ms => new Promise(res => setTimeout(res, ms));

  function setButtonsDisabled(state) {
    btnFlash.disabled = state;
    btnBackup.disabled = state;
    portSelect.disabled = state;
    backupTypeSelect.disabled = state;
  }

  // Оновлення списку збережених портів із пріоритизацією Betaflight/STM32
  async function refreshPortList() {
    if (!('serial' in navigator)) return;

    availablePorts = await navigator.serial.getPorts();
    portSelect.innerHTML = '';

    let bestIndex = -1;

    availablePorts.forEach((p, idx) => {
      const info = p.getInfo();
      const vid = info.usbVendorId ? '0x' + info.usbVendorId.toString(16).padStart(4, '0') : null;
      const pid = info.usbProductId ? '0x' + info.usbProductId.toString(16).padStart(4, '0') : null;

      let label = `Пристрій ${idx + 1}`;
      let isBetaflight = false;
      console.log(JSON.stringify(info, null, 2));

      // STMicroelectronics VCP (STM32F4/F7/G4): VID 0x0483 (1155)
      if (info.usbVendorId === 0x0483 || info.usbVendorId === 1155) {
        label = `Betaflight STM32 (VID:${vid} PID:${pid})`;
        isBetaflight = true;
      } else if (vid && pid) {
        label = `USB Serial (VID:${vid} PID:${pid})`;
      }

      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = label;
      portSelect.appendChild(opt);

      // Пріоритет віддається польотнику Betaflight
      if (isBetaflight && bestIndex === -1) {
        bestIndex = idx;
      }
    });

    // Опція для ручного запиту нового пристрою
    const optNew = document.createElement('option');
    optNew.value = 'new';
    optNew.textContent = '+ Обрати / Додати новий порт...';
    portSelect.appendChild(optNew);

    if (bestIndex !== -1) {
      portSelect.value = bestIndex;
      log(`Автовизначено порт Betaflight (номер ${bestIndex + 1}).`);
    } else if (availablePorts.length > 0) {
      portSelect.value = 0;
    } else {
      portSelect.value = 'new';
    }
  }

  // Оновлювати дропдаун при підключенні/відключенні USB
  if ('serial' in navigator) {
    navigator.serial.addEventListener('connect', () => {
      log('Виявлено підключення пристрою на USB. Оновлення списку...');
      refreshPortList();
    });
    navigator.serial.addEventListener('disconnect', () => {
      log('USB-пристрій відключено.');
      refreshPortList();
    });
    refreshPortList();
  }

  // Отримання обраного порту (або запит нового через системне вікно)
  async function resolveSelectedPort() {
    const selectedVal = portSelect.value;
    if (selectedVal === 'new' || !availablePorts[selectedVal]) {
      log('Відкриття системного вікна вибору порту...');
      const requestedPort = await navigator.serial.requestPort();
      await refreshPortList();
      return requestedPort;
    } else {
      log(`Використання збереженого порту: ${portSelect.options[portSelect.selectedIndex].text}`);
      return availablePorts[selectedVal];
    }
  }

  function downloadTextFile(filename, text) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  async function readCliResponse(reader, timeoutMs = 2500, stopOnPrompt = true) {
    let output = '';
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      const { value, done } = await Promise.race([
        reader.read(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 200))
      ]).catch(() => ({ value: null, done: false }));

      if (done) break;
      if (value) {
        output += value;
        if (stopOnPrompt && (output.includes('\n# ') || output.trim().endsWith('#'))) {
          break;
        }
      }
    }
    return output;
  }

  function parseBoardName(text) {
    if (!text) return null;
    const nameMatch = text.match(/name:\s*([A-Za-z0-9_-]+)/i);
    if (nameMatch) return nameMatch[1].toUpperCase();

    const boardNameMatch = text.match(/board_name\s+([A-Za-z0-9_-]+)/i);
    if (boardNameMatch) return boardNameMatch[1].toUpperCase();

    const boardMatch = text.match(/Board:\s*([A-Za-z0-9_-]+)/i);
    if (boardMatch) return boardMatch[1].toUpperCase();

    if (text.toUpperCase().includes('SPEDIXF722')) return 'SPEDIXF722';
    return null;
  }

  // ==================== 1. ЗБЕРЕЖЕННЯ БЕКАПУ ====================
  btnBackup.addEventListener('click', async () => {
    if (!('serial' in navigator)) {
      showPopup('error', 'Браузер не підтримується', 'Потрібен браузер із підтримкою Web Serial API.');
      return;
    }

    setButtonsDisabled(true);
    let reader = null;
    let writer = null;
    let textEncoder = null;
    const cmd = backupTypeSelect.value;

    try {
      port = await resolveSelectedPort();
      await port.open({ baudRate: 115200 });

      textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      await writer.write('#\r\n');
      await delay(350);
      let initEcho = await readCliResponse(reader, 800);
      if (!initEcho.includes('#')) {
        await writer.write('\r\n#\r\n');
        await delay(350);
        initEcho += await readCliResponse(reader, 800);
      }

      log('Зчитування даних плати...');
      await writer.write('status\r\n');
      await delay(150);
      const statusText = await readCliResponse(reader, 1200);
      const boardName = parseBoardName(initEcho + '\n' + statusText) || 'SPEDIXF722';
      log(`Плата: ${boardName}`);

      log(`Виконується команда "${cmd}"...`);
      await writer.write(`${cmd}\r\n`);

      let dumpContent = '';
      const dumpStart = Date.now();
      const maxDumpTime = 12000;

      while (Date.now() - dumpStart < maxDumpTime) {
        const chunk = await readCliResponse(reader, 1500, false);
        if (chunk) {
          dumpContent += chunk;
          if (dumpContent.includes('\n# ') || dumpContent.trim().endsWith('#')) {
            break;
          }
        }
      }

      if (!dumpContent || dumpContent.length < 80) {
        throw new Error('Отримано порожню або обірвану відповідь від контролера.');
      }

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      const filename = `BTFL_backup_${boardName}_${timeStr}.txt`;

      downloadTextFile(filename, dumpContent);
      log(`Файл збережено: ${filename}`);

      try { await writer.write('exit\r\n'); await delay(250); } catch (_) {}
      try { await reader.cancel(); reader.releaseLock(); } catch (_) {}
      try { writer.releaseLock(); await textEncoder.readable.cancel(); } catch (_) {}
      try { await port.close(); } catch (_) {}
      port = null;

      log('COM-порт успішно звільнено.');
      showPopup('success', 'Бекап збережено', `Конфігурацію збережено у файл ${filename}. Порт вільний.`);

    } catch (err) {
      console.error(err);
      log(`Помилка: ${err.message}`);
      if (port) {
        try { await port.close(); } catch (_) {}
        port = null;
      }
      showPopup('error', 'Збій бекапу', err.message);
    } finally {
      setButtonsDisabled(false);
    }
  });

  // ==================== 2. ЗАЛИВАННЯ ПРЕСЕТУ ==================== v1

  btnFlash.addEventListener('click', async () => {
    if (!('serial' in navigator)) {
      showPopup('error', 'Помилка', 'Web Serial API не підтримується.');
      return;
    }

    const script = document.getElementById('presetInput').value.trim();
    if (!script) {
      showPopup('error', 'Помилка', 'Поле пресету порожнє.');
      return;
    }

    setButtonsDisabled(true);
    let reader = null;
    let writer = null;
    let textEncoder = null;
    let isRebooting = false;

    try {
      // If port was left open from a prior run, close it first
      if (port && port.readable) {
        await closeSerialSession(port, reader, writer, textEncoder);
        port = null;
      }

      port = await resolveSelectedPort();
      await port.open({ baudRate: 115200 });
      log('Зʼєднання відкрито на 115200.');

      textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      // 1. Enter CLI mode
      log('Ініціалізація CLI (#)...');
      await writer.write('#\r\n');
      await delay(350);
      let initEcho = await readCliResponse(reader, 800);

      if (!initEcho.includes('#')) {
        await writer.write('\r\n#\r\n');
        await delay(350);
        initEcho += await readCliResponse(reader, 800);
      }

      // 2. Query target identity
      log('Зчитування даних плати...');
      await writer.write('version\r\n');
      await delay(150);
      const verText = await readCliResponse(reader, 1200);

      await writer.write('status\r\n');
      await delay(150);
      const statusText = await readCliResponse(reader, 1500);

      const fullOutput = initEcho + '\n' + verText + '\n' + statusText;
      let actualBoard = parseBoardName(fullOutput);

      const expectedBoardMatch = script.match(/(?:board_name|#\s*target:?)\s+([A-Za-z0-9_-]+)/i);
      const expectedBoard = expectedBoardMatch ? expectedBoardMatch[1].toUpperCase() : null;

      log(`Очікувана плата: [${expectedBoard || 'Не вказана'}]`);
      log(`Фактична плата: [${actualBoard || 'Не розпізнано'}]`);

      // 3. Target verification & graceful exit on mismatch
      if (expectedBoard && actualBoard) {
        if (!actualBoard.includes(expectedBoard) && !expectedBoard.includes(actualBoard)) {
          // Send exit to leave CLI cleanly on the mismatched board
          try {
            await writer.write('exit\r\n');
            await delay(200);
          } catch (_) {}

          throw new Error(`НЕВІДПОВІДНІСТЬ ПЛАТИ! Пресет для [${expectedBoard}], але підключено [${actualBoard}].`);
        }
      } else if (!actualBoard) {
        throw new Error('Не вдалося отримати ідентифікатор плати від контролера. Перевірте, чи закритий Betaflight Configurator.');
      }

      log(`Плата підтверджена: [${actualBoard}]. Заливання команд...`);

      // 4. Send configuration commands
      const lines = script.split('\n');
      let containsSave = false;

      for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;
        if (line.toLowerCase() === 'save') containsSave = true;

        log(`> ${line}`);
        await writer.write(line + '\r\n');
        await delay(35);
      }

      // 5. Save & Reboot
      isRebooting = true;
      log('> save');
      if (!containsSave) {
        await writer.write('save\r\n');
      }

      await delay(400);

      // Clean normal shutdown
      await closeSerialSession(port, reader, writer, textEncoder);
      port = null;

      log('COM-порт звільнено.');
      showPopup('success', 'Успішно', 'Пресет записано, контролер перезавантажився, COM-порт вільний.');

    } catch (err) {
      if (isRebooting || err.message.includes('device has been lost')) {
        log('Контролер пішов на перезавантаження. Зʼєднання скинуто штатно.');
        port = null;
        showPopup('success', 'Успішно', 'Пресет застосовано! Контролер перезавантажився, COM-порт вільний.');
      } else {
        console.error(err);
        log(`Помилка: ${err.message}`);

        // GUARANTEED PORT RELEASE ON MISMATCH / ERROR
        await closeSerialSession(port, reader, writer, textEncoder);
        port = null;
        log('COM-порт примусово закрито після помилки.');

        showPopup('error', 'Збій операції', err.message);
      }
    } finally {
      setButtonsDisabled(false);
    }
  });
  // Dedicated cleanup helper that unlocks all streams before closing the port
  async function closeSerialSession(portObj, readerObj, writerObj, encoderObj) {
    if (readerObj) {
      try {
        await readerObj.cancel();
        readerObj.releaseLock();
      } catch (_) {}
    }
    if (writerObj) {
      try {
        writerObj.releaseLock();
      } catch (_) {}
    }
    if (encoderObj) {
      try {
        await encoderObj.readable.cancel();
      } catch (_) {}
    }
    if (portObj) {
      try {
        // Small pause to let stream locks settle before closing
        await delay(50);
        await portObj.close();
      } catch (e) {
        console.warn('port.close() warning:', e);
      }
    }
  }
