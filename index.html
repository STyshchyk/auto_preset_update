<!DOCTYPE html>

  <title>Betaflight Preset / Diff Auto-Flasher</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 30px;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #ffaa00; }
    textarea {
      width: 100%;
      height: 180px;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px;
      box-sizing: border-box;
      font-family: monospace;
      resize: vertical;
    }
    .controls { margin-top: 15px; display: flex; gap: 10px; }
    button {
      background: #ffaa00;
      color: #000;
      border: none;
      padding: 10px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e09600; }
    button:disabled { background: #555; cursor: not-allowed; color: #888; }
    #log {
      margin-top: 15px;
      background: #000;
      color: #00ff66;
      font-family: monospace;
      padding: 10px;
      border-radius: 4px;
      height: 140px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
    }
    /* Popup Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #222;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      min-width: 280px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .modal-box.success { border-left: 8px solid #00ff66; }
    .modal-box.error { border-left: 8px solid #ff3333; }
    .modal-box h3 { margin-top: 0; }
    .btn-close {
      margin-top: 15px;
      background: #444;
      color: white;
    }
  </style>
</head>

<div class="card">
  <h2>Betaflight Preset & Diff Flasher</h2>
  <label for="presetInput">Вставте команди (diff / dump / preset / CLI commands):</label>
  <textarea id="presetInput" placeholder="set osd_warn_bitmask = 1
set vtx_band = 5
save"></textarea>

  <div class="controls">
    <button id="btnConnect">Підключити та прошити</button>
  </div>

  <div id="log">Очікування дії...</div>
</div>

<!-- Модальне вікно для результатів -->
<div id="statusModal" class="modal">
  <div id="modalBox" class="modal-box">
    <h3 id="modalTitle">Статус</h3>
    <p id="modalMsg"></p>
    <button class="btn-close" onclick="closeModal()">Закрити</button>
  </div>
</div>

    logDiv.textContent += msg + '\n';

    const modal = document.getElementById('statusModal');
    const box = document.getElementById('modalBox');
    box.className = 'modal-box ' + type;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = message;
    modal.style.display = 'flex';
  }

    document.getElementById('statusModal').style.display = 'none';

    navigator.serial.addEventListener('connect', async (e) => {
      log('Виявлено новий пристрій на USB!');
    });

  btnConnect.addEventListener('click', async () => {
    if (!('serial' in navigator)) {
      showPopup('error', 'Помилка браузера', 'Web Serial API не підтримується.');
      return;
    }

    const script = document.getElementById('presetInput').value.trim();
    if (!script) {
      showPopup('error', 'Порожній пресет', 'Введіть команди для заливання.');
      return;
    }

    btnConnect.disabled = true;
    let reader = null;
    let writer = null;
    let isSaving = false; // Прапорець етапу перезавантаження

    try {
      log('Запит COM-порту...');
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      log('Порт відкрито на 115200 бод.');

      const textEncoder = new TextEncoderStream();
      const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      const textDecoder = new TextDecoderStream();
      const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      // Читання відповідей
      (async () => {
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) console.log('[FC]:', value);
          }
        } catch (e) {
          // Якщо помилка сталася під час збереження/ребуту — це нормальна поведінка
          if (!isSaving) {
            console.warn('Потік читання скинуто:', e);
          }
        }
      })();

      // 1. Вхід у режим CLI
      log('Перехід у режим CLI Betaflight (#)...');
      await writer.write('#\n');
      await delay(400);

      // 2. Відправка рядків пресету
      const lines = script.split('\n');
      let containsSave = false;

      for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;
        if (line.toLowerCase() === 'save') containsSave = true;

        log(`> ${line}`);
        await writer.write(line + '\n');
        await delay(50);
      }

      // 3. Відправка save та перехоплення ребуту
      isSaving = true; // Встановлюємо статус перед збереженням
      log('> save');
      if (!containsSave) {
        await writer.write('save\n');
      }

      log('Дані записано. Очікування перезавантаження FC...');
      await delay(300);

      // 4. Безпечне звільнення та закриття без падіння при розриві USB
      try {
        await reader.cancel();
        reader.releaseLock();
      } catch (_) {}

      try {
        writer.releaseLock();
        await textEncoder.readable.cancel();
      } catch (_) {}

      try {
        await port.close();
      } catch (_) {}
      port = null;

      log('COM-порт успішно звільнено!');
      showPopup('success', 'Успішно', 'Пресет записано, контролер перезавантажився, порт вільний!');

    } catch (err) {
      // Якщо контролер розірвав зв'язок під час save — це успіх, а не креш
      if (isSaving || err.message.includes('device has been lost')) {
        log('Контролер пішов на перезавантаження. Зʼєднання скинуто коректно.');
        port = null;
        showPopup('success', 'Успішно', 'Пресет застосовано! Контролер перезавантажився, порт доступний.');
      } else {
        console.error(err);
        log(`Помилка: ${err.message}`);
        if (port) {
          try { await port.close(); } catch (_) {}
          port = null;
        }
        showPopup('error', 'Креш / Помилка', `Збій процесу: ${err.message}`);
      }
    } finally {
      btnConnect.disabled = false;
    }
  });
