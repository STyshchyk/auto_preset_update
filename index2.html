<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaflight Preset Auto-Flasher (SPEDIXF722)</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333333;
      --primary: #ffaa00;
      --primary-hover: #e09600;
      --text: #e0e0e0;
      --terminal: #00ff66;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h2 {
      margin-top: 0;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 11px;
      background: #333;
      padding: 3px 8px;
      border-radius: 4px;
      color: #aaa;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #bbb;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #181818;
      color: #eee;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      box-sizing: border-box;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12px;
      resize: vertical;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }

    button {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 11px 20px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      font-size: 14px;
    }

    button:hover { background: var(--primary-hover); }
    button:disabled { background: #444; cursor: not-allowed; color: #777; }

    #log {
      margin-top: 15px;
      background: #080808;
      color: var(--terminal);
      font-family: Consolas, Monaco, "Courier New", monospace;
      padding: 12px;
      border-radius: 6px;
      height: 160px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      border: 1px solid #222;
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-box {
      background: #202020;
      padding: 24px;
      border-radius: 8px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-box.success { border-left: 8px solid #00ff66; }
    .modal-box.error { border-left: 8px solid #ff3333; }
    .modal-box h3 { margin-top: 0; font-size: 18px; }
    .modal-box p { font-size: 14px; line-height: 1.4; color: #ccc; }

    .btn-close {
      margin-top: 15px;
      background: #333;
      color: #fff;
    }
    .btn-close:hover { background: #444; }
  </style>
</head>
<body>

<div class="card">
  <h2>
    Betaflight Preset Flasher
    <span class="badge">Auto-Verify: SPEDIXF722</span>
  </h2>

  <label for="presetInput">Команди пресету / dump / diff для заливання:</label>
  <textarea id="presetInput">defaults nosave

# version
# Betaflight / STM32F7X2 (S7X2) 4.5.1 Dec  2 2024 / 10:06:22 (77d01ba3b) MSP API: 1.46
batch start
defaults nosave

board_name SPEDIXF722
manufacturer_id SPDX

# resources
resource MOTOR 5 NONE
resource SERVO 1 B06
resource LED_STRIP 1 C14
resource LED 1 NONE

# feature
feature SERVO_TILT
feature OSD

servo 0 1000 2000 1500 100 7

# aux
aux 0 0 0 1700 2100 0 0
aux 1 1 2 1300 1700 0 0
aux 2 2 2 1700 2100 0 0
aux 3 40 1 1500 2100 0 0
aux 4 40 0 900 900 0 33

# master
set gyro_lpf1_type = PT2
set dyn_notch_q = 450
set yaw_motors_reversed = ON
set small_angle = 45
set craft_name = T-System 13

save</textarea>

  <div class="controls">
    <button id="btnConnect">Підключити та прошити</button>
  </div>

  <div id="log">Очікування дії...</div>
</div>

<div id="statusModal" class="modal">
  <div id="modalBox" class="modal-box">
    <h3 id="modalTitle">Статус</h3>
    <p id="modalMsg"></p>
    <button class="btn-close" onclick="closeModal()">Закрити</button>
  </div>
</div>

<script>
  let port = null;
  const logDiv = document.getElementById('log');
  const btnConnect = document.getElementById('btnConnect');

  function log(msg) {
    logDiv.textContent += msg + '\n';
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function showPopup(type, title, message) {
    const modal = document.getElementById('statusModal');
    const box = document.getElementById('modalBox');
    box.className = 'modal-box ' + type;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalMsg').textContent = message;
    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('statusModal').style.display = 'none';
  }

  const delay = ms => new Promise(res => setTimeout(res, ms));

  // Зчитування тексту з CLI до появи запрошення або закінчення таймауту
  async function readCliResponse(reader, timeoutMs = 1500) {
    let output = '';
    const start = Date.now();
    while (Date.now() - start < timeoutMs) {
      const { value, done } = await Promise.race([
        reader.read(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 250))
      ]).catch(() => ({ value: null, done: false }));

      if (done) break;
      if (value) {
        output += value;
        if (output.includes('# ') || output.trim().endsWith('#')) break;
      }
    }
    return output;
  }

  // Вилучення очікуваних даних із тексту пресету
  function extractExpectedInfo(text) {
    let board = null;
    let version = null;

    const verMatch = text.match(/Betaflight\s*\/[^\d]+(\d+\.\d+(?:\.\d+)?)/i);
    if (verMatch) version = verMatch[1];

    const boardMatch = text.match(/(?:board_name|#\s*target:?)\s+([A-Za-z0-9_-]+)/i);
    if (boardMatch) board = boardMatch[1];

    return { board, version };
  }

  // Парсинг фактичних даних польотника з CLI
  function parseConnectedInfo(cliText) {
    let board = null;
    let version = null;

    const boardMatch = cliText.match(/name:\s*([A-Za-z0-9_-]+)/i) || cliText.match(/Board:\s*([A-Za-z0-9_-]+)/i);
    if (boardMatch) board = boardMatch[1];

    const verMatch = cliText.match(/Betaflight\s*\/[^\d]+(\d+\.\d+(?:\.\d+)?)/i);
    if (verMatch) version = verMatch[1];

    return { board, version };
  }

  btnConnect.addEventListener('click', async () => {
    if (!('serial' in navigator)) {
      showPopup('error', 'Браузер не підтримується', 'Потрібен браузер на базі Chromium (Google Chrome, Edge, Opera) з увімкненим Web Serial API.');
      return;
    }

    const script = document.getElementById('presetInput').value.trim();
    if (!script) {
      showPopup('error', 'Порожній пресет', 'Вставте команди конфігурації у текстове поле.');
      return;
    }

    btnConnect.disabled = true;
    let reader = null;
    let writer = null;
    let textEncoder = null;
    let isRebooting = false;

    try {
      log('Запит підключення до COM-порту...');
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      log('Зʼєднання відкрито на швидкості 115200.');

      textEncoder = new TextEncoderStream();
      textEncoder.readable.pipeTo(port.writable);
      writer = textEncoder.writable.getWriter();

      const textDecoder = new TextDecoderStream();
      port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      // 1. Вхід у режим CLI
      log('Ініціалізація CLI (#)...');
      await writer.write('#\n');
      await delay(300);
      await readCliResponse(reader, 600);

      // 2. Зчитування статусу та версії плати
      log('Запит версії та статусу контролера...');
      await writer.write('version\n');
      const verText = await readCliResponse(reader, 1000);

      await writer.write('status\n');
      const statusText = await readCliResponse(reader, 1200);

      const actual = parseConnectedInfo(verText + '\n' + statusText);
      const expected = extractExpectedInfo(script);
      log(`Визначено плату: [${actual.board || 'Невідомо'}]`);
      console.log(verText)
      console.log(statusText)
      log(`Визначено прошивку: [${actual.version || 'Невідомо'}]`);

      // 3. Захисна перевірка плати та версії
      if (expected.board && actual.board) {
        if (!actual.board.toUpperCase().includes(expected.board.toUpperCase()) &&
          !expected.board.toUpperCase().includes(actual.board.toUpperCase())) {
          throw new Error(`Невідповідність плати! Пресет створено для [${expected.board}], а підключено [${actual.board}].`);
        }
      }

      if (expected.version && actual.version) {
        const expMajor = expected.version.split('.').slice(0, 2).join('.');
        const actMajor = actual.version.split('.').slice(0, 2).join('.');
        if (expMajor !== actMajor) {
          throw new Error(`Конфлікт прошивки! Пресет для версії [${expMajor}.x], а на польотнику [${actMajor}.x].`);
        }
      }

      log('Перевірку плати пройдено. Завантаження конфігурації...');

      // 4. Заливання команд
      const lines = script.split('\n');
      let containsSave = false;

      for (let line of lines) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;
        if (line.toLowerCase() === 'save') containsSave = true;

        log(`> ${line}`);
        await writer.write(line + '\n');
        await delay(35); // Захисна пауза буфера UART
      }

      // 5. Збереження та обробка ребуту
      isRebooting = true;
      log('> save');
      if (!containsSave) {
        await writer.write('save\n');
      }

      log('Дані записано. Очікування перезавантаження FC...');
      await delay(400);

      // Безпечне закриття дескрипторів
      try { await reader.cancel(); reader.releaseLock(); } catch (_) {}
      try { writer.releaseLock(); await textEncoder.readable.cancel(); } catch (_) {}
      try { await port.close(); } catch (_) {}
      port = null;

      log('Порт звільнено. Контролер готовий до роботи.');
      showPopup('success', 'Успішно', 'Пресет успішно залито! Контролер перезавантажився, COM-порт вільний для конфігуратора.');

    } catch (err) {
      // Обробка очікуваного від'єднання USB під час перезавантаження
      if (isRebooting || err.message.includes('device has been lost')) {
        log('Польотник пішов на перезавантаження. Зʼєднання скинуто успішно.');
        port = null;
        showPopup('success', 'Успішно', 'Пресет застосовано! Контролер перезавантажився, COM-порт вільний.');
      } else {
        console.error(err);
        log(`Помилка: ${err.message}`);
        if (port) {
          try { await port.close(); } catch (_) {}
          port = null;
        }
        showPopup('error', 'Збій операції', err.message);
      }
    } finally {
      btnConnect.disabled = false;
    }
  });
</script>

</body>
</html>
